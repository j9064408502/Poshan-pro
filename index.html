            Google: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>,
            ChevronRight: ({className=""}) => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="9 18 15 12 9 6"/></svg>,

            Export: ({s=20}) => <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>,
            Refresh: ({s=20}) => <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>,
            FormImagePlaceholder: () => (
                <svg width="55" height="55" viewBox="0 0 24 24" fill="none" stroke="#f4b772" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round">

        const BeneficiaryCard = ({ title, count, imgSrc }) => (
            <div className="bg-white rounded-[24px] p-3.5 flex flex-col justify-between h-[155px] relative shadow-sm overflow-hidden">
                <h3 className="text-[11px] font-black text-slate-700 uppercase leading-tight w-[80%] z-30 relative">{title}</h3>
                <div className="bg-[#d45652] text-white font-black text-[13px] px-5 py-1.5 rounded-full w-fit mt-auto mb-1 z-30 relative shadow-sm">{count}</div>
                <div className="absolute bottom-0 right-0 w-[70%] h-[75%] flex items-end justify-end pointer-events-none z-10">
                    <div className="w-[120%] h-[120%] bg-[#fcf2f4] rounded-tl-full absolute bottom-[-20%] right-[-20%] z-0"></div>
                    <img src={imgSrc} className="relative z-10 object-contain h-full max-h-[90px] mr-1.5 mb-1.5" alt={title} />
                </div>
            </div>
        );

        const AgeStatCard = ({ label, m, f, bg }) => (
            <div className={`${bg} border-[2.5px] border-[#222222] rounded-[32px] p-2 py-3 flex flex-col items-center justify-center gap-1.5 shadow-md`}>
                <div className="border border-white/70 text-white font-bold text-[11px] px-4 py-0.5 rounded-full whitespace-nowrap">{label}</div>
                <div className="flex gap-2">
                    <div className="border border-white/70 text-white font-bold text-[11px] px-3 py-0.5 rounded-full">M : {m}</div>
                    <div className="border border-white/70 text-white font-bold text-[11px] px-3 py-0.5 rounded-full">F : {f}</div>
                </div>
            </div>
        );

        const safeLocalStorage = {
            getItem: (key) => { try { return localStorage.getItem(key); } catch (e) { return null; } },
            setItem: (key, value) => { try { localStorage.setItem(key, value); } catch (e) { } },
            removeItem: (key) => { try { localStorage.removeItem(key); } catch (e) { } }
        };

        const firebaseConfig = {
            apiKey: "AIzaSyCAxRX_R0KSFsDdU3oUmQgG8JwYZ6edg4k",
            authDomain: "poshanpro-7816d.firebaseapp.com",
            projectId: "poshanpro-7816d",
            storageBucket: "poshanpro-7816d.firebasestorage.app",
            messagingSenderId: "454892989088",
            appId: "1:454892989088:web:6b6c2b03691c7f424a37c5",
            measurementId: "G-9PK4W4424C"
        };

        let auth, db;
        try {
            if (typeof firebase !== 'undefined') {
                if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
                auth = firebase.auth(); db = firebase.firestore();
                auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);
            }
        } catch (e) { }

        const appId = "poshan-pro-restore-v1";

        const App = () => {
            const [view, setView] = useState('login'); 
            const [user, setUser] = useState(null);
            const [isGuest, setIsGuest] = useState(false);
            const [members, setMembers] = useState([]);
            const [viewingHead, setViewingHead] = useState(null);
            const [searchTerm, setSearchTerm] = useState('');
            const [editingId, setEditingId] = useState(null);
            const [isSaving, setIsSaving] = useState(false);
            const fileInputRef = useRef(null);
            
            // Excel Upload States & Refs
            const fileInputRefExcel = useRef(null);
            const [isUploadingExcel, setIsUploadingExcel] = useState(false);
            const [refreshTick, setRefreshTick] = useState(0);

            const [loginTab, setLoginTab] = useState('userpass'); 
            const [isSignUp, setIsSignUp] = useState(false); 
            const [username, setUsername] = useState('');
            const [password, setPassword] = useState('');

            const [phone, setPhone] = useState('');
            const [otp, setOtp] = useState('');
            const [otpSent, setOtpSent] = useState(false);
            const [isBtnLoading, setIsBtnLoading] = useState(false);
            const [confirmResult, setConfirmResult] = useState(null);

            const initialForm = {
                firstName: '', lastName: '', gender: 'Male', birthDate: '', 
                mobile: '', aadhaar: '', photoURL: '', 
                poribarNo: '', relationToHead: 'Self', isFamilyHead: false, headId: '',
                maternalStatus: 'NA'
            };
            const [formData, setFormData] = useState(initialForm);

            // --- Helper to parse age in months from DD/MM/YYYY ---
            const calculateAgeInMonths = (birthDateStr) => {
                if (!birthDateStr || birthDateStr.length < 10) return -1;
                const parts = birthDateStr.split('/');
                if (parts.length !== 3) return -1;
                const [d, m, y] = parts.map(Number);
                const bDate = new Date(y, m - 1, d);
                const today = new Date();
                if (isNaN(bDate.getTime())) return -1;

                let years = today.getFullYear() - bDate.getFullYear();
                let months = today.getMonth() - bDate.getMonth();
                let totalMonths = years * 12 + months;
                if (today.getDate() < bDate.getDate()) {
                    totalMonths--;
                }
                return totalMonths;
            };

            // --- Real-time Beneficiaries Counts Calculation ---
            const beneficiaryCounts = useMemo(() => {
                let preg = 0, lact = 0, c0_6m = 0, c6m_3y = 0, c3y_6y = 0, c0_6y_total = 0;
                let cat = {
                    '0-6m_m': 0, '0-6m_f': 0, '6m-1y_m': 0, '6m-1y_f': 0,
                    '1y-2y_m': 0, '1y-2y_f': 0, '2y-3y_m': 0, '2y-3y_f': 0,
                    '3y-4y_m': 0, '3y-4y_f': 0, '4y-5y_m': 0, '4y-5y_f': 0,
                    '5y-6y_m': 0, '5y-6y_f': 0, 'total_m': 0, 'total_f': 0
                };

                members.forEach(m => {
                    if (m.maternalStatus === 'PREG') preg++;
                    if (m.maternalStatus === 'LACT') lact++;

                    const months = calculateAgeInMonths(m.birthDate);
                    if (months >= 0 && months <= 72) {
                        c0_6y_total++;
                        const isFemale = (m.gender === 'Female' || m.gender === 'Girl');
                        const isMale = (m.gender === 'Male' || m.gender === 'Boy');

                        if (months <= 6) { c0_6m++; if (isMale) cat['0-6m_m']++; else if (isFemale) cat['0-6m_f']++; } 
                        else if (months <= 12) { c6m_3y++; if (isMale) cat['6m-1y_m']++; else if (isFemale) cat['6m-1y_f']++; } 
                        else if (months <= 24) { c6m_3y++; if (isMale) cat['1y-2y_m']++; else if (isFemale) cat['1y-2y_f']++; } 
                        else if (months <= 36) { c6m_3y++; if (isMale) cat['2y-3y_m']++; else if (isFemale) cat['2y-3y_f']++; } 
                        else if (months <= 48) { c3y_6y++; if (isMale) cat['3y-4y_m']++; else if (isFemale) cat['3y-4y_f']++; } 
                        else if (months <= 60) { c3y_6y++; if (isMale) cat['4y-5y_m']++; else if (isFemale) cat['4y-5y_f']++; } 
                        else if (months <= 72) { c3y_6y++; if (isMale) cat['5y-6y_m']++; else if (isFemale) cat['5y-6y_f']++; }

                        if (isMale) cat['total_m']++;
                        if (isFemale) cat['total_f']++;
                    }
                });
                return { preg, lact, c0_6m, c6m_3y, c3y_6y, c0_6y_total, cat };
            }, [members]);

            const isFormValid = !!(
                formData.poribarNo?.toString().trim() && 
                formData.firstName?.trim() && 
                formData.lastName?.trim() && 
                formData.gender &&
                formData.birthDate?.length === 10 && 
                formData.aadhaar?.length === 12
            );

            useEffect(() => {
                if (!auth) { setIsGuest(true); setView('dashboard'); return; }
                auth.getRedirectResult().then(res => {
                    if (res && res.user) { setUser(res.user); setIsGuest(false); setView('dashboard'); }
                }).catch(e => {});

                const unsub = auth.onAuthStateChanged(u => {
                    if (u) { setUser(u); setIsGuest(false); setView('dashboard'); } 
                    else { if (safeLocalStorage.getItem('poshan_is_guest') === 'true') { setIsGuest(true); setView('dashboard'); } else { setView('login'); } }
                }, err => { setView('login'); });
                return () => { if (unsub) unsub(); };
            }, []);

            const loadLocalDataFallback = () => {
                const cached = safeLocalStorage.getItem('poshan_local_registry_members');
                if (cached) { try { setMembers(JSON.parse(cached)); } catch(e) { setMembers([]); } } else { setMembers([]); }
            };

            const saveLocalData = (newMembers) => {
                safeLocalStorage.setItem('poshan_local_registry_members', JSON.stringify(newMembers));
                setMembers(newMembers);
            };

            useEffect(() => {
                if (user && !isGuest && db) {
                    try {
                        const col = db.collection('artifacts').doc(appId).collection('users').doc(user.uid).collection('members');
                        return col.onSnapshot(snap => { 
                            const remoteData = snap.docs.map(d => ({id: d.id, ...d.data()}));
                            setMembers(remoteData);
                            safeLocalStorage.setItem('poshan_local_registry_members', JSON.stringify(remoteData));
                        }, err => { loadLocalDataFallback(); });
                    } catch(e) { loadLocalDataFallback(); }
                } else { loadLocalDataFallback(); }
            }, [user, isGuest, refreshTick]);

            useEffect(() => {
                if (viewingHead) { const freshHead = members.find(m => m.id === viewingHead.id); if (freshHead) setViewingHead(freshHead); }
            }, [members]);

            // --- EXCEL UPLOAD LOGIC ---
            const handleExcelUpload = async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                setIsUploadingExcel(true);

                try {
                    const data = await file.arrayBuffer();
                    const workbook = XLSX.read(data);
                    const sheet = workbook.Sheets[workbook.SheetNames[0]];
                    // Raw: false ensures dates are read as strings (assuming cell formatted correctly)
                    const jsonData = XLSX.utils.sheet_to_json(sheet, { raw: false, defval: "" });

                    const groups = {};
                    jsonData.forEach(row => {
                        const fId = String(row.Family_ID || '').trim();
                        if (!fId) return;
                        if (!groups[fId]) groups[fId] = [];
                        groups[fId].push(row);
                    });

                    let newMembersArray = [...members];
                    const batch = db ? db.batch() : null;
                    const dbCol = db && user && !isGuest ? db.collection('artifacts').doc(appId).collection('users').doc(user.uid).collection('members') : null;
                    
                    let addedCount = 0;

                    for (const fId in groups) {
                        const family = groups[fId];
                        const headRow = family.find(r => String(r.Role).toLowerCase().trim() === 'head');
                        if (!headRow) continue; // Must have a head

                        let headDocId = 'local-' + Date.now() + Math.random().toString(36).substr(2, 9);
                        
                        const headData = {
                            firstName: headRow.First_Name || '',
                            lastName: headRow.Last_Name || '',
                            gender: headRow.Gender || 'Male',
                            birthDate: headRow.Birth_Date || '',
                            mobile: String(headRow.Mobile || '').replace(/\D/g, '').slice(0, 10),
                            aadhaar: String(headRow.Aadhaar || '').replace(/\D/g, '').slice(0, 12),
                            maternalStatus: headRow.Maternal_Status || 'NA',
                            poribarNo: fId,
                            relationToHead: 'Self',
                            isFamilyHead: true,
                            headId: '',
                            photoURL: '',
                            createdAt: Date.now(),
                            updatedAt: Date.now()
                        };

                        if (dbCol) {
                            const newDoc = dbCol.doc();
                            headDocId = newDoc.id;
                            batch.set(newDoc, headData);
                        } else {
                            headData.id = headDocId;
                            newMembersArray.push(headData);
                        }
                        addedCount++;

                        family.forEach(memberRow => {
                            if (String(memberRow.Role).toLowerCase().trim() === 'head') return;
                            
                            const memberData = {
                                firstName: memberRow.First_Name || '',
                                lastName: memberRow.Last_Name || '',
                                gender: memberRow.Gender || 'Male',
                                birthDate: memberRow.Birth_Date || '',
                                mobile: String(memberRow.Mobile || '').replace(/\D/g, '').slice(0, 10),
                                aadhaar: String(memberRow.Aadhaar || '').replace(/\D/g, '').slice(0, 12),
                                maternalStatus: memberRow.Maternal_Status || 'NA',
                                poribarNo: fId,
                                relationToHead: memberRow.Relation || 'Other',
                                isFamilyHead: false,
                                headId: headDocId,
                                photoURL: '',
                                createdAt: Date.now(),
                                updatedAt: Date.now()
                            };

                            if (dbCol) {
                                const newDoc = dbCol.doc();
                                batch.set(newDoc, memberData);
                            } else {
                                memberData.id = 'local-' + Date.now() + Math.random().toString(36).substr(2, 9);
                                newMembersArray.push(memberData);
                            }
                            addedCount++;

                                <div className="p-5 space-y-6">
                                    <div className="flex items-center gap-4">
                                        <div onClick={() => fileInputRef.current?.click()} className="w-[125px] h-[125px] bg-white border-[3px] border-[#ef5f8b] rounded-[20px] shadow-sm flex items-center justify-center overflow-hidden"><Icons.FormImagePlaceholder /></div>
                                        <div className="flex-1 space-y-1.5"><label className="text-[12px] font-black text-[#ef5f8b] uppercase">FAMILY ID*</label><input className="w-full py-4 px-5 border-[1.5px] border-[#94a3b8] rounded-[18px] font-bold" value={formData.poribarNo} onChange={e => setFormData({...formData, poribarNo: e.target.value.replace(/\D/g, '')})} disabled={!formData.isFamilyHead} /></div>
                                    </div>
                                    <button onClick={handleSave} disabled={isSaving || !isFormValid} className={`w-full py-[18px] text-white rounded-full font-black italic text-[22px] shadow-lg border-[3px] mt-2 uppercase tracking-widest leading-none ${(!isFormValid || isSaving) ? 'bg-slate-400 opacity-60 border-slate-500 cursor-not-allowed' : 'bg-[#ef5f8b] border-[#312e81]'}`}>{isSaving ? "SYNCING..." : "SAVE & SYNC"}</button>
                                </div>
                            </div>
                        )}

                        {/* ==================== HOUSEHOLD ==================== */}
                        {view === 'household' && viewingHead && (
                            /* Existing Household view preserved */
                            <div className="min-h-screen bg-[#fde1e9] animate-view pb-20 -mt-6">
                                <div className="bg-[#a65ebd] rounded-b-[24px] pt-8 pb-8 px-4 shadow-sm relative z-10">
                                    <div className="flex justify-between items-center mb-1">
                                        <button onClick={() => setView('addHeadDashboard')} className="border-[1.5px] border-white/60 p-2 rounded-[10px] text-white"><Icons.CurvedBack /></button>
                                        <h1 className="text-white font-black italic uppercase text-[17px] tracking-widest text-center flex-1">HEAD FAMILY DETAILS</h1>
                                    </div>
                                </div>
                                <div className="p-4 space-y-6">
                                    <button onClick={() => setView('selectRelation')} className="w-full border-[2px] border-dashed border-[#ef5f8b] py-14 px-6 rounded-[32px] flex flex-col items-center justify-center gap-4 bg-transparent text-[#ef5f8b]">
                                        <div className="w-16 h-16 bg-white rounded-full flex items-center justify-center shadow-sm border-[1px] border-[#ef5f8b]/20"><Icons.Plus s={32} className="text-[#ef5f8b]" /></div>
                                        <span className="text-[12px] font-black uppercase italic tracking-widest text-[#ef5f8b]">ADD MEMBER TO HOUSEHOLD</span>
                                    </button>
                                </div>
                            </div>
                        )}

                        {/* ==================== SELECT RELATION ==================== */}
                        {view === 'selectRelation' && viewingHead && (
                            <div className="min-h-screen bg-[#fde1e9] animate-view pb-20 -mt-6">
                                <div className="bg-[#a65ebd] rounded-b-[32px] pt-12 pb-8 px-4 shadow-sm relative z-10 flex items-center justify-center">
                                    <button onClick={() => setView('household')} className="absolute left-4 border-[1.5px] border-white/60 p-2 rounded-[10px] text-white"><Icons.CurvedBack /></button>
                                    <h1 className="text-white font-black italic uppercase text-[17px] tracking-widest mt-1">SELECT RELATION TO HEAD</h1>
                                </div>
                            </div>
                        )}

                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
