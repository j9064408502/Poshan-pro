            // Copy Helper for Pop-up
            const handleCopy = (text, fieldName) => {
                if (!text) return;
                if (navigator.clipboard) {
                    navigator.clipboard.writeText(text).catch(e => {});
                } else {
                    const el = document.createElement('textarea');
                    el.value = text;
                    document.body.appendChild(el);
                    el.select();
                    try { document.execCommand('copy'); } catch (err) {}
                    document.body.removeChild(el);
                }
                setCopiedField(fieldName);
                setTimeout(() => setCopiedField(null), 2000);
            };

            // --- SAFELY PARSED CALCULATIONS TO PREVENT CRASHES ---
            const calculateAgeInMonths = (birthDateStr) => {
                if (!birthDateStr || typeof birthDateStr !== 'string' || birthDateStr.length < 10) return -1;
                const parts = birthDateStr.split('/');
                if (parts.length !== 3) return -1;
                const [d, m, y] = parts.map(Number);
                const bDate = new Date(y, m - 1, d);
                const today = new Date();
                if (isNaN(bDate.getTime())) return -1;
                let years = today.getFullYear() - bDate.getFullYear();
                let months = today.getMonth() - bDate.getMonth();
                let totalMonths = years * 12 + months;
                if (today.getDate() < bDate.getDate()) { totalMonths--; }
                return totalMonths;
            };

            const parseAgeStringToMonths = (str) => {
                if (!str || typeof str !== 'string') return 0;
                let totalM = 0;
                const yMatch = str.match(/(\d+)\s*y/i);
                const mMatch = str.match(/(\d+)\s*m/i);
                if (yMatch) totalM += parseInt(yMatch[1], 10) * 12;
                if (mMatch) totalM += parseInt(mMatch[1], 10);
                return totalM;
            };

            const calcAgeString = (birthDateStr) => {
                if (!birthDateStr || typeof birthDateStr !== 'string' || birthDateStr.length < 10) return '';
                const parts = birthDateStr.split('/'); if(parts.length !== 3) return '';
                const [d, m, y] = parts.map(Number); const bd = new Date(y, m-1, d); const today = new Date();
                if(isNaN(bd.getTime())) return '';
                let yrs = today.getFullYear() - bd.getFullYear();
                let mos = today.getMonth() - bd.getMonth();
                if(mos < 0 || (mos === 0 && today.getDate() < bd.getDate())) { yrs--; mos += 12; }
                return `${yrs.toString().padStart(2, '0')}-${mos.toString().padStart(2, '0')}`;
            };

            // AUTOMATIC DATA MIGRATION (CONVERTS BOY -> MALE, GIRL -> FEMALE)
            const normalizeData = (dataArray) => {
                if (!Array.isArray(dataArray)) return [];
                return dataArray.map(m => {
                    if (!m) return null;
                    let updated = { ...m };
                    if (updated.gender === 'Boy') updated.gender = 'Male';
                    if (updated.gender === 'Girl') updated.gender = 'Female';
                    if (updated.relationToHead === 'Boy') updated.relationToHead = 'Son';
                    if (updated.relationToHead === 'Girl') updated.relationToHead = 'Daughter';
                    return updated;
                }).filter(Boolean);
            };

            const handleDeskSearch = () => {
                const minM = parseAgeStringToMonths(deskMinAgeInput);
                const maxM = parseAgeStringToMonths(deskMaxAgeInput);
                if (minM > maxM) {
                    alert("Minimum age cannot be greater than maximum age!");
                    return;
                }
                setAppliedDeskMin(minM);
                setAppliedDeskMax(maxM);
            };

            const deskFilteredAndSortedMembers = useMemo(() => {
                return (members || []).filter(m => {
                    if (!m) return false;
                    const months = calculateAgeInMonths(m.birthDate);
                    return months >= appliedDeskMin && months <= appliedDeskMax;
                }).sort((a, b) => {
                    return String(a.poribarNo || '').localeCompare(String(b.poribarNo || ''));
                });
            }, [members, appliedDeskMin, appliedDeskMax]);

            const deskCounts = useMemo(() => {
                let male = 0, female = 0;
                deskFilteredAndSortedMembers.forEach(m => {
                    if (!m) return;
                    if (m.gender === 'Male') male++;
                    if (m.gender === 'Female') female++;
                });
                return { male, female, total: male + female };
            }, [deskFilteredAndSortedMembers]);

            const handleAgeSearch = () => {
                const minMonths = parseAgeStringToMonths(minAgeInput);
                const maxMonths = parseAgeStringToMonths(maxAgeInput);

                if (minMonths > maxMonths) { alert("Min age cannot be greater than Max age!"); return; }

                let boyCount = 0; let girlCount = 0;
                (members || []).forEach(m => {
                    if (!m) return;
                    const months = calculateAgeInMonths(m.birthDate);
                    if (months >= minMonths && months <= maxMonths) {
                        if (m.gender === 'Male') boyCount++;
                        if (m.gender === 'Female') girlCount++;
                    }
                });

                setAgeSearchCounts({ boy: boyCount, girl: girlCount });
                setAppliedAgeRange({min: minMonths, max: maxMonths});
                setIsAgePopupOpen(false);
            };

            const handleSortFilterSearch = () => {
                setAppliedSort(tempSort);
                setAppliedGender(tempGender);
                setIsSortPopupOpen(false);

                let preg = 0, lact = 0, c0_6m = 0, c6m_3y = 0, c3y_6y = 0, c0_6y_total = 0;

                    if (!m) return;
                    if (m.maternalStatus === 'PREG') preg++;
                    if (m.maternalStatus === 'LACT') lact++;

                        else if (months <= 72) c3y_6y++;

                });
                return { preg, lact, c0_6m, c6m_3y, c3y_6y, c0_6y_total };
            }, [members]);

            const filteredAndSortedChildren = useMemo(() => {
                let list = (members || []).filter(m => {
                    if(!m) return false;
                    const months = calculateAgeInMonths(m.birthDate);
                    return months >= appliedAgeRange.min && months <= appliedAgeRange.max;
                });

                if (appliedGender === 'boy') {
                    list = list.filter(m => m.gender === 'Male');
                } else if (appliedGender === 'girl') {
                    list = list.filter(m => m.gender === 'Female');
                }

                list.sort((a, b) => {
                    if (appliedSort === 'name') {
                        return `${a.firstName || ''} ${a.lastName || ''}`.localeCompare(`${b.firstName || ''} ${b.lastName || ''}`);
                    } else {
                        return calculateAgeInMonths(a.birthDate) - calculateAgeInMonths(b.birthDate);
                    }
                });

                return list;
            }, [members, appliedAgeRange, appliedGender, appliedSort]);

            const ageDisplay = useMemo(() => { return calcAgeString(formData.birthDate); }, [formData.birthDate]);

            const isFormValid = !!(formData.poribarNo?.toString().trim() && formData.firstName?.trim() && formData.lastName?.trim() && formData.gender && formData.birthDate?.length === 10 && formData.aadhaar?.length === 12);

            useEffect(() => {
                if (!auth) { setIsGuest(true); setView('dashboard'); return; }
                auth.getRedirectResult().then(res => { if (res && res.user) { setUser(res.user); setIsGuest(false); setView('dashboard'); } }).catch(e => {});
                const unsub = auth.onAuthStateChanged(u => {
                    if (u) { setUser(u); setIsGuest(false); setView('dashboard'); } 
                    else { if (safeLocalStorage.getItem('poshan_is_guest') === 'true') { setIsGuest(true); setView('dashboard'); } else { setView('login'); } }
                }, err => { setView('login'); });
                return () => { if (unsub) unsub(); };
            }, []);

            const loadLocalDataFallback = () => { 
                const cached = safeLocalStorage.getItem('poshan_local_registry_members'); 
                if (cached) { 
                    try { 
                        const parsed = JSON.parse(cached);
                        if(Array.isArray(parsed)) {
                            setMembers(normalizeData(parsed)); 
                        } else {
                            setMembers([]);
                        }
                    } catch(e) { setMembers([]); } 
                } else { setMembers([]); } 
            };
            const saveLocalData = (newMembers) => { 
                const cleanMembers = normalizeData(newMembers);
                safeLocalStorage.setItem('poshan_local_registry_members', JSON.stringify(cleanMembers)); 
                setMembers(cleanMembers); 
            };

            useEffect(() => {
                if (user && !isGuest && db) {
                    try {
                        const col = db.collection('artifacts').doc(appId).collection('users').doc(user.uid).collection('members');
                        return col.onSnapshot(snap => { 
                            const remoteData = snap.docs.map(d => ({id: d.id, ...d.data()}));
                            const cleanRemote = normalizeData(remoteData); 
                            setMembers(cleanRemote); 
                            saveLocalData(cleanRemote);
                        }, err => { loadLocalDataFallback(); });
                    } catch(e) { loadLocalDataFallback(); }
                } else { loadLocalDataFallback(); }
            }, [user, isGuest, refreshTick]);

            useEffect(() => { 
                if (viewingHead) { 
                    const freshHead = (members || []).find(m => m && m.id === viewingHead.id); 
                    if (freshHead) setViewingHead(freshHead); 
                } 
            }, [members]);

            const handleDownloadData = () => {
                if ((members || []).length === 0) { alert("No data available to download."); return; }
                const sortedMembers = [...members].sort((a, b) => {
                    if (a.poribarNo === b.poribarNo) { return a.isFamilyHead ? -1 : 1; }
                    return String(a.poribarNo || '').localeCompare(String(b.poribarNo || ''));
                });
                const exportData = sortedMembers.map(m => ({
                    Family_ID: m.poribarNo || '', Role: m.isFamilyHead ? 'Head' : 'Member', Relation: m.relationToHead || 'Self', First_Name: m.firstName || '',
                    Last_Name: m.lastName || '', Gender: m.gender || '', Birth_Date: m.birthDate || '', Mobile: m.mobile || '', Aadhaar: m.aadhaar || '', Maternal_Status: m.maternalStatus || 'NA'
                }));
                try {
                    const ws = XLSX.utils.json_to_sheet(exportData); const wb = XLSX.utils.book_new();
                    XLSX.utils.book_append_sheet(wb, ws, "Family_Data"); XLSX.writeFile(wb, "Poshan_Master_Data.xlsx");
                } catch (error) { alert("Download failed. Make sure your browser allows downloads."); }
            };

            const handleExcelUpload = async (e) => {
                const file = e.target.files[0]; if (!file) return; setIsUploadingExcel(true);
                try {
                    const data = await file.arrayBuffer(); const workbook = XLSX.read(data);
                    const sheet = workbook.Sheets[workbook.SheetNames[0]]; const jsonData = XLSX.utils.sheet_to_json(sheet, { raw: false, defval: "" });
                    const groups = {};
                    jsonData.forEach(row => {
                        const fId = String(row.Family_ID || '').trim(); if (!fId) return;
                        if (!groups[fId]) groups[fId] = []; groups[fId].push(row);
                    });
                    let newMembersArray = [...(members || [])];
                    const batch = db && user && !isGuest ? db.batch() : null;
                    const dbCol = db && user && !isGuest ? db.collection('artifacts').doc(appId).collection('users').doc(user.uid).collection('members') : null;
                    let addedCount = 0;

                    for (const fId in groups) {
                        const family = groups[fId]; const headRow = family.find(r => String(r.Role).toLowerCase().trim() === 'head');
                        if (!headRow) continue;
                        let headDocId = 'local-' + Date.now() + Math.random().toString(36).substr(2, 9);
                        const headAge = calcAgeString(headRow.Birth_Date);

                        const headData = {
                            firstName: headRow.First_Name || '', lastName: headRow.Last_Name || '', gender: headRow.Gender || 'Male',
                            birthDate: headRow.Birth_Date || '', age: headAge, mobile: String(headRow.Mobile || '').replace(/\D/g, '').slice(0, 10),
                            aadhaar: String(headRow.Aadhaar || '').replace(/\D/g, '').slice(0, 12), maternalStatus: headRow.Maternal_Status || 'NA',
                            poribarNo: fId, relationToHead: 'Self', isFamilyHead: true, headId: '', photoURL: '', createdAt: Date.now(), updatedAt: Date.now()
                        };

                        if (dbCol) { const newDoc = dbCol.doc(); headDocId = newDoc.id; batch.set(newDoc, headData); } 
                        else { headData.id = headDocId; newMembersArray.push(headData); }
                        addedCount++;

                        family.forEach(memberRow => {
                            if (String(memberRow.Role).toLowerCase().trim() === 'head') return;
                            const rel = memberRow.Relation || 'Other';
                            let targetGender = memberRow.Gender || 'Male';
                            if (['Wife', 'Mother', 'Mother in Law', 'Daughter'].includes(rel)) { targetGender = 'Female'; } 
                            else if (['Husband', 'Father', 'Father in Law', 'Son'].includes(rel)) { targetGender = 'Male'; } 
                            else if (rel === 'Girl') { targetGender = 'Female'; } else if (rel === 'Boy') { targetGender = 'Male'; }
                            const memberAge = calcAgeString(memberRow.Birth_Date);

                            const memberData = {
                                firstName: memberRow.First_Name || '', lastName: memberRow.Last_Name || '', gender: targetGender,
                                birthDate: memberRow.Birth_Date || '', age: memberAge, mobile: String(memberRow.Mobile || '').replace(/\D/g, '').slice(0, 10),
                                aadhaar: String(memberRow.Aadhaar || '').replace(/\D/g, '').slice(0, 12), maternalStatus: memberRow.Maternal_Status || 'NA',
                                poribarNo: fId, relationToHead: rel, isFamilyHead: false, headId: headDocId, photoURL: '', createdAt: Date.now(), updatedAt: Date.now()
                            };

                            if (dbCol) { const newDoc = dbCol.doc(); batch.set(newDoc, memberData); } 
                            else { memberData.id = 'local-' + Date.now() + Math.random().toString(36).substr(2, 9); newMembersArray.push(memberData); }
                            addedCount++;
                        });
                    }

                    if (dbCol && batch) { await batch.commit(); alert(`Success: Imported ${addedCount} members to Database!`); } 
                    else { saveLocalData(newMembersArray); alert(`Success: Imported ${addedCount} members locally!`); }
                } catch (err) { alert("Error processing Excel File! Make sure formats match."); } 
                finally { setIsUploadingExcel(false); if (fileInputRefExcel.current) fileInputRefExcel.current.value = null; setRefreshTick(t => t + 1); }
            };

            const handleUserPassAuth = async (e) => {
                e.preventDefault(); if (!username.trim() || password.length < 6 || isBtnLoading || !auth) return; setIsBtnLoading(true);
                const email = username.trim().toLowerCase().includes('@') ? username.trim().toLowerCase() : `${username.trim().toLowerCase()}@poshanpro.com`;
                try { if (isSignUp) { await auth.createUserWithEmailAndPassword(email, password); alert("Account Registry Success!"); } else { await auth.signInWithEmailAndPassword(email, password); } setIsGuest(false); } 
                catch (err) { alert("Error: " + err.message); } finally { setIsBtnLoading(false); }
            };

            const handleGoogleLogin = async () => { if (!auth || isBtnLoading) return; setIsBtnLoading(true); try { await auth.signInWithRedirect(new firebase.auth.GoogleAuthProvider()); } catch (e) { setIsBtnLoading(false); } };
            const sendOTP = async () => {
                if (!auth || phone.length < 10 || isBtnLoading) return; setIsBtnLoading(true);
                try {
                    if (window.recaptchaVerifier) window.recaptchaVerifier.clear();
                    window.recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha-container', { 'size': 'invisible' });
                    const result = await auth.signInWithPhoneNumber("+91" + phone, window.recaptchaVerifier);
                    setConfirmResult(result); setOtpSent(true);
                } catch (e) { alert("OTP Error."); } finally { setIsBtnLoading(false); }
            };
            const verifyOTP = async () => { if (otp.length < 6 || isBtnLoading) return; setIsBtnLoading(true); try { await confirmResult.confirm(otp); setIsGuest(false); } catch (e) { alert("Invalid Code!"); } finally { setIsBtnLoading(false); } };
            const skipLogin = () => { safeLocalStorage.setItem('poshan_is_guest', 'true'); setIsGuest(true); setView('dashboard'); };
            const handleLogout = () => { if (confirm("Logout?")) { if (auth) auth.signOut().catch(e => {}); safeLocalStorage.removeItem('poshan_is_guest'); setIsGuest(false); setUser(null); setView('login'); } };

                { l: 'MEMBERS', v: (members || []).length, bgLeft: 'bg-[#cbdcf6]', bgRight: 'bg-[#dbe5f7]', img: 'assets/fa.png' },
                { l: 'FEMALE', v: (members || []).filter(x => x && x.gender === 'Female').length, bgLeft: 'bg-[#fbd8df]', bgRight: 'bg-[#fae1e6]', img: 'assets/f.png' },
                { l: 'MALE', v: (members || []).filter(x => x && x.gender === 'Male').length, bgLeft: 'bg-[#abddf5]', bgRight: 'bg-[#c1ebfa]', img: 'assets/m.png' }
            ], [members]);

                if (!viewingHead) return ['Wife', 'Husband', 'Son', 'Daughter', 'Mother', 'Father', 'Mother in Law', 'Father in Law', 'Other'];

                    ['Wife', 'Son', 'Daughter', 'Mother', 'Father', 'Mother in Law', 'Father in Law', 'Other'] : 
                    ['Husband', 'Son', 'Daughter', 'Mother', 'Father', 'Mother in Law', 'Father in Law', 'Other'];
                const houseRels = (members || []).filter(m => m && m.headId === viewingHead.id && !m.isFamilyHead).map(m => m.relationToHead);
                return rawList.filter(r => {
                    const singles = ['Wife', 'Husband', 'Mother', 'Father', 'Mother in Law', 'Father in Law'];
                    if (singles.includes(r) && houseRels.includes(r)) return false; return true;
                });
            }, [viewingHead, members]);

            const globalSearchResults = useMemo(() => {
                if (!searchTerm || !searchTerm.trim()) return [];
                const query = searchTerm.toLowerCase().trim();
                return (members || []).filter(m => m && (`${m.firstName || ''} ${m.lastName || ''}`.toLowerCase().includes(query) || String(m.poribarNo || '').toLowerCase().includes(query)));
            }, [searchTerm, members]);

            const handleSave = async () => {
                if (isSaving || !isFormValid) return; setIsSaving(true);
                const data = { ...formData, age: ageDisplay, updatedAt: Date.now() };

                if (user && !isGuest && db) {
                    try {
                        const col = db.collection('artifacts').doc(appId).collection('users').doc(user.uid).collection('members');
                        if (editingId) { await col.doc(editingId).update(data); } else { await col.add({...data, createdAt: Date.now()}); }
                        const wasHead = data.isFamilyHead; setEditingId(null); setFormData(initialForm); setIsSaving(false);
                        if (wasHead) setView('addHeadDashboard'); else setView('household');
                    } catch (e) { alert("Database error. Local saved."); setIsSaving(false); }
                } else {
                    let localMembers = [...(members || [])];
                    if (editingId) { localMembers = localMembers.map(m => m.id === editingId ? {...m, ...data} : m); } 
                    else { localMembers.push({...data, id: 'local-' + Date.now(), createdAt: Date.now()}); }
                    saveLocalData(localMembers); 
                    const wasHead = data.isFamilyHead; setEditingId(null); setFormData(initialForm); setIsSaving(false);
                    if (wasHead) setView('addHeadDashboard'); else setView('household');
                }
            };

            const handleDeleteFamily = async (headId) => {
                if (!confirm("Delete family household?")) return;
                if (!isGuest && user && db) {
                    const toDelete = (members || []).filter(m => m && (m.id === headId || m.headId === headId));
                    const batch = db.batch();
                    const dbCol = db.collection('artifacts').doc(appId).collection('users').doc(user.uid).collection('members');
                    toDelete.forEach(item => batch.delete(dbCol.doc(item.id))); await batch.commit();
                } else { saveLocalData((members || []).filter(m => m && m.id !== headId && m.headId !== headId)); }
                setView('addHeadDashboard');
            };

            const handleDeleteMember = async (targetId) => {
                if (!confirm("Delete member?")) return;
                if (!isGuest && user && db) { await db.collection('artifacts').doc(appId).collection('users').doc(user.uid).collection('members').doc(targetId).delete(); } 
                else { saveLocalData((members || []).filter(m => m && m.id !== targetId)); }
            };

            const filteredHeads = (members || []).filter(m => m && m.isFamilyHead).filter(h => h && (`${h.firstName || ''} ${h.lastName || ''}`.toLowerCase().includes(searchTerm.toLowerCase()) || String(h.poribarNo || '').toLowerCase().includes(searchTerm.toLowerCase())));

            // ==========================================
            // RENDER BLOCKS
            // ==========================================

            if (view === 'login') {
                return (
                    <div className="min-h-screen bg-slate-50 flex flex-col items-center justify-center p-6 animate-view">
                        <div className="w-full max-w-sm bg-white p-8 rounded-[48px] shadow-2xl text-center space-y-6 border-b-8 border-indigo-100 leading-none">
                            <div className="mx-auto w-16 h-16 bg-[#ac5ebd] text-white rounded-[22px] flex items-center justify-center shadow-xl rotate-3 text-2xl font-black italic">P</div>
                            <div>
                                <h2 className="text-2xl font-black italic tracking-tighter text-[#ac5ebd] uppercase">Poshan Pro</h2>
                                <p className="text-slate-400 text-[10px] font-bold uppercase mt-1 tracking-widest leading-none">Family Registry</p>
                            </div>
                            <div className="flex bg-slate-100 p-1 rounded-2xl gap-1 text-[10px] font-bold">
                                <button onClick={() => setLoginTab('userpass')} className={`flex-1 py-3 rounded-xl uppercase transition-all ${loginTab === 'userpass' ? 'bg-[#ac5ebd] text-white shadow-md' : 'text-slate-500'}`}>User/Pass</button>
                                <button onClick={() => setLoginTab('otp')} className={`flex-1 py-3 rounded-xl uppercase transition-all ${loginTab === 'otp' ? 'bg-[#ac5ebd] text-white shadow-md' : 'text-slate-500'}`}>OTP</button>
                                <button onClick={() => setLoginTab('google')} className={`flex-1 py-3 rounded-xl uppercase transition-all ${loginTab === 'google' ? 'bg-[#ac5ebd] text-white shadow-md' : 'text-slate-500'}`}>Google</button>
                            </div>
                            <div className="space-y-4">
                                {loginTab === 'userpass' && (
                                    <form onSubmit={handleUserPassAuth} className="space-y-3">
                                        <input type="text" placeholder="Username" className="w-full p-4 border-2 border-slate-100 rounded-2xl font-bold outline-none text-sm" value={username} onChange={e => setUsername(e.target.value)} required />
                                        <input type="password" placeholder="Password (Min 6)" className="w-full p-4 border-2 border-slate-100 rounded-2xl font-bold outline-none text-sm" value={password} onChange={e => setPassword(e.target.value)} required />
                                        <button type="submit" className="w-full py-4 bg-[#ac5ebd] text-white rounded-2xl font-black uppercase text-xs tracking-wider shadow-md">{isBtnLoading ? "Processing..." : (isSignUp ? "Sign Up" : "Login Now")}</button>
                                        <button type="button" onClick={() => setIsSignUp(!isSignUp)} className="text-[10px] font-bold text-[#ac5ebd] underline block mx-auto mt-2">{isSignUp ? "Have account? Log In" : "New user? Sign Up"}</button>
                                    </form>
                                )}
                                {loginTab === 'otp' && (
                                    <div className="space-y-3">
                                        {!otpSent ? (
                                            <div className="space-y-3">
                                                <div className="relative">
                                                    <div className="absolute left-5 top-1/2 -translate-y-1/2 font-bold text-slate-400 border-r pr-3">+91</div>
                                                    <input placeholder="Mobile Number" className="w-full p-4 pl-16 border-2 border-slate-100 rounded-2xl font-bold outline-none text-sm" value={phone} onChange={e => setPhone(e.target.value.replace(/\D/g, '').slice(0,10))} inputMode="tel" />
                                                </div>
                                                <button onClick={sendOTP} className="w-full py-4 bg-[#ac5ebd] text-white rounded-2xl font-black uppercase text-xs tracking-wider shadow-md">Send OTP</button>
                                            </div>
                                        ) : (
                                            <div className="space-y-3">
                                                <input placeholder="6-digit OTP" className="w-full p-4 border-2 border-slate-100 rounded-2xl font-black text-center tracking-[0.5em] text-md outline-none" value={otp} onChange={e => setOtp(e.target.value.replace(/\D/g, '').slice(0,6))} inputMode="numeric" />
                                                <button onClick={verifyOTP} className="w-full py-4 bg-emerald-600 text-white rounded-2xl font-black uppercase text-xs tracking-wider shadow-md">Verify Code</button>
                                            </div>
                                        )}
                                    </div>
                                )}
                                {loginTab === 'google' && (
                                    <button onClick={handleGoogleLogin} className="w-full p-4 bg-white border-2 border-slate-100 rounded-2xl flex items-center justify-center gap-4 font-black uppercase text-xs hover:bg-slate-50"><Icons.Google /> Continue with Gmail</button>
                                )}
                                <div className="flex items-center gap-4 py-1"><div className="h-px flex-1 bg-slate-100"></div><span className="text-[10px] font-black text-slate-300 uppercase">OR</span><div className="h-px flex-1 bg-slate-100"></div></div>
                                <button onClick={skipLogin} className="w-full p-2 text-[#8b5cf6] font-black uppercase text-[11px] tracking-[0.1em]">Skip Login &gt;</button>
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className={`min-h-screen animate-view ${view === 'dashboard' ? 'bg-[#df5b86]' : (view === 'memberDataDesk' ? 'bg-[#fde1e9]' : 'bg-[#e52165]')}`}>
                    
                    {/* Top Nav Bar ONLY renders when current view is 'dashboard' */}
                    {view === 'dashboard' && (
                        <nav className="sticky top-0 bg-[#ac5ebd] text-white p-4 pt-5 pb-5 flex items-center justify-between shadow-sm z-[60] rounded-b-[24px]">
                            <div className="flex flex-col text-left font-black tracking-tighter leading-[0.9] uppercase">
                                <span className="text-[20px] tracking-wider font-sans">FAMELY</span><span className="text-[18px] tracking-widest font-sans ml-4">DATA</span>
                            </div>
                            <div className="flex items-center gap-2">
                                <button onClick={() => setView('dashboard')} className="w-10 h-10 border-[1.5px] border-white/80 rounded-full flex items-center justify-center shadow-sm active:scale-95 transition-transform bg-transparent">
                                    <Icons.Export s={18} />
                                </button>
                                <button onClick={handleLogout} className="w-10 h-10 border-[1.5px] border-white/80 rounded-full flex items-center justify-center shadow-sm active:scale-95 transition-transform bg-transparent">
                                    <Icons.Settings s={18} />
                                </button>
                            </div>
                        </nav>
                    )}

                    {/* Standard Inner Pages Header */}
                    {!['dashboard', 'addHeadDashboard', 'form', 'household', 'selectRelation', 'beneficiaries', 'memberDataDesk'].includes(view) && (
                        <nav className="sticky top-0 bg-indigo-700 text-white p-4 flex items-center justify-between shadow-xl z-[60]">
                            <div className="flex items-center gap-3">
                                <button onClick={() => { if (view === 'selectRelation') setView('household'); }} className="p-1"><Icons.ArrowLeft /></button>
                                <span className="text-xl font-black italic uppercase tracking-tighter leading-none">Poshan Pro</span>
                            </div>

                        </nav>
                    )}

                    <div className="max-w-md mx-auto space-y-6">
                        
                        {/* ==================== DASHBOARD ==================== */}
                        {view === 'dashboard' && (
                            <div className="animate-view p-4 pb-10">
                                
                                {/* DASHBOARD GRID CARDS WITH NEW BUTTON */}

                                                    <p className="text-[10px] font-black text-[#5a5a5a] uppercase tracking-tight mb-0.5 leading-none">{s.l}</p>

                                        </div>

                                        <div className="flex items-center gap-2 h-full w-full">
                                            <div className="h-full w-[75px] flex items-end justify-center shrink-0 -ml-1"><img src="assets/h.png" className="h-[95%] w-full object-contain object-bottom" /></div>

                                        <span className="text-[#3e34b1] font-black text-[13px] uppercase">TO</span>
                                    </div>
                                    <input value={maxAgeInput} onChange={e => setMaxAgeInput(e.target.value.toUpperCase())} className="w-[120px] h-[50px] rounded-r-full border-[3px] border-black text-center font-black text-[#3e34b1] text-[16px] uppercase placeholder-slate-400 outline-none z-10 shadow-inner" placeholder="6Y" />
                                </div>

                                <div className="flex justify-center mb-10">
                                    <button onClick={handleAgeSearch} className="flex items-center h-[46px] bg-[#edf2f2] rounded-full border-[2.5px] border-black overflow-hidden active:scale-95 transition-transform shadow-md">
                                        <span className="px-6 font-black text-[#3e34b1] text-[15px] uppercase tracking-wide">SEARCH</span>
                                        <div className="h-full w-[46px] bg-[#edf2f2] border-l-[2.5px] border-black flex items-center justify-center shadow-inner text-black">
                                            <Icons.Search />
                                        </div>
                                    </button>
                                </div>

                                <div className="flex justify-between gap-1.5">
                                    <div className="flex-1 bg-[#edf2f2] border-[1.5px] border-[#9ba5a0] rounded-[18px] py-3 text-center shadow-sm">
                                        <span className="font-black text-[#2b363c] text-[12px] uppercase tracking-wider">BOY : <span className="ml-1">{ageSearchCounts.boy}</span></span>
                                    </div>
                                    <div className="flex-1 bg-[#edf2f2] border-[1.5px] border-[#9ba5a0] rounded-[18px] py-3 text-center shadow-sm">
                                        <span className="font-black text-[#2b363c] text-[12px] uppercase tracking-wider">GIRL : <span className="ml-1">{ageSearchCounts.girl}</span></span>
                                    </div>
                                    <div className="flex-[1.4] bg-[#edf2f2] border-[1.5px] border-[#9ba5a0] rounded-[18px] py-3 text-center shadow-sm">
                                        <span className="font-black text-[#2b363c] text-[11px] uppercase tracking-wider">BOY + GIRL : <span className="ml-1">{ageSearchCounts.boy + ageSearchCounts.girl}</span></span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* ==================== SORT/FILTER POPUP (MODAL) ==================== */}
                    {isSortPopupOpen && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center bg-black/60 px-4 backdrop-blur-sm animate-view">
                            <div className="bg-[#9c54ac] w-full max-w-sm rounded-[32px] p-6 pt-10 relative shadow-2xl border-[3px] border-[#8a4b9c] animate-pop">
                                
                                <button onClick={() => { setIsSortPopupOpen(false); setTempSort(appliedSort); setTempGender(appliedGender); }} className="absolute -top-4 -right-4 bg-white text-rose-500 w-10 h-10 rounded-full font-black text-xl shadow-lg border-2 border-rose-500 flex items-center justify-center active:scale-90 transition-transform">
                                    ✕
                                </button>

                                <div className="flex justify-center mb-8">
                                    <div className="bg-[#e2e9e6] px-8 py-2 rounded-full shadow-inner border-[1.5px] border-white flex gap-2 items-center">
                                        <span className="text-[#f14b8a] font-black italic uppercase text-[15px] tracking-widest">FILTER</span>
                                    </div>
                                </div>

                                {/* Sort Options (BY NAME vs BY AGE) */}
                                <div className="flex items-center justify-center gap-0 mb-8 relative">
                                    <button onClick={() => setTempSort('name')} className={`w-[130px] h-[50px] rounded-l-full border-[3px] border-black text-center font-black text-[14px] uppercase outline-none z-10 transition-colors shadow-inner ${tempSort === 'name' ? 'bg-white text-[#3e34b1]' : 'bg-[#e2e9e6] text-[#8a96a0]'}`}>
                                        BY NAME
                                    </button>
                                    
                                    <div className="w-[48px] h-[48px] rounded-full border-[3px] border-black bg-white flex items-center justify-center z-20 -mx-4 shadow-md text-black">
                                        <Icons.MenuIcon />
                                    </div>
                                    
                                    <button onClick={() => setTempSort('age')} className={`w-[130px] h-[50px] rounded-r-full border-[3px] border-black text-center font-black text-[14px] uppercase outline-none z-10 transition-colors shadow-inner ${tempSort === 'age' ? 'bg-white text-[#3e34b1]' : 'bg-[#e2e9e6] text-[#8a96a0]'}`}>
                                        BY AGE
                                    </button>
                                </div>

                                {/* Gender Filter Options */}
                                <div className="flex justify-between gap-1.5 mb-8">
                                    <button onClick={() => setTempGender('boy')} className={`flex-1 border-[2.5px] rounded-[18px] py-3.5 text-center shadow-sm font-black text-[12px] uppercase tracking-wider transition-all ${tempGender === 'boy' ? 'bg-white text-[#3e34b1] border-black' : 'bg-[#edf2f2] text-[#2b363c] border-[#9ba5a0]'}`}>
                                        BOY
                                    </button>
                                    <button onClick={() => setTempGender('girl')} className={`flex-1 border-[2.5px] rounded-[18px] py-3.5 text-center shadow-sm font-black text-[12px] uppercase tracking-wider transition-all ${tempGender === 'girl' ? 'bg-white text-[#3e34b1] border-black' : 'bg-[#edf2f2] text-[#2b363c] border-[#9ba5a0]'}`}>
                                        GIRL
                                    </button>
                                    <button onClick={() => setTempGender('all')} className={`flex-[1.4] border-[2.5px] rounded-[18px] py-3.5 text-center shadow-sm font-black text-[11px] uppercase tracking-wider transition-all ${tempGender === 'all' ? 'bg-white text-[#3e34b1] border-black' : 'bg-[#edf2f2] text-[#2b363c] border-[#9ba5a0]'}`}>
                                        BOY + GIRL
                                    </button>
                                </div>

                                {/* Final Search Button */}
                                <div className="flex justify-center mb-2">
                                    <button onClick={handleSortFilterSearch} className="flex items-center h-[46px] bg-[#edf2f2] rounded-full border-[2.5px] border-black overflow-hidden active:scale-95 transition-transform shadow-md">
                                        <span className="px-8 font-black text-[#3e34b1] text-[15px] uppercase tracking-wide">SEARCH</span>
                                        <div className="h-full w-[46px] bg-[#edf2f2] border-l-[2.5px] border-black flex items-center justify-center shadow-inner text-black">
                                            <Icons.Search />
                                        </div>
                                    </button>
                                </div>

                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
